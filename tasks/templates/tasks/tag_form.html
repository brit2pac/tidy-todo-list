{% extends 'tasks/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<header class="page-header"><div><div class="eyebrow">TAGS</div><h1>{{ title }}</h1><p class="subtitle">Give related tasks a shared label.</p></div></header><section class="form-card"><form method="post">{% csrf_token %}<div class="form-field"><label for="{{ form.name.id_for_label }}">Tag name<span class="required">*</span></label>{{ form.name }}{% for error in form.name.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div><div class="form-actions"><a href="{% url 'tag-list' %}" class="button secondary">Cancel</a><button class="button primary" type="submit">Save tag</button></div></form></section>{% endblock %}
